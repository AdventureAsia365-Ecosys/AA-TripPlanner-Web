name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "task/**", "chore/**", "feature/**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # All backend unit tests are offline (no DB / Mapbox / Bedrock);
        # PYTHONPATH points at the repo root so `import backend.*` resolves.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v --tb=short

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Build must pass without any secrets. NEXT_PUBLIC_MAPBOX_TOKEN is
        # intentionally unset here — the app builds and degrades gracefully.
        run: npm run build
