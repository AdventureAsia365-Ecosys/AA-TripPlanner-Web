name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "task/**", "chore/**", "feature/**"]
  # AA-879: deploy-lambdas.yml calls this whole workflow as its `ci` job, so a Lambda deploy runs only
  # after every check below passed on the commit it ships.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AA-902: this repo is public, so no AWS account ID, ARN with an account, VPC/SG/subnet ID,
      # Cognito pool ID or API Gateway host in any tracked file (DM-6.10). Stdlib only, whole repo;
      # it lives in this job because "Backend (pytest)" is a required check (blocks the merge).
      - name: No literal AWS resource IDs (failing)
        working-directory: .
        run: python3 .github/scripts/check_resource_ids.py

      # AA-879: offline tests of the CI helper scripts (fake curl / aws on PATH, no network), e.g. that a
      # missing security header on an app page fails.
      - name: CI script tests
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save pip cache
        if: github.ref == 'refs/heads/main' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Run unit tests
        # All backend unit tests are offline (no DB / Mapbox / Bedrock);
        # PYTHONPATH points at the repo root so `import backend.*` resolves.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v --tb=short


  # AA-879: the security job, same shape as AA-Booking's "Security Audit" (the resource-ID check stays in
  # "Backend (pytest)", which is already required). pip-audit FAILS on any known vulnerability in the Lambda
  # requirements. The gitleaks scan that ran here moved to .github/workflows/secret-scan.yml (AA-981 follow-up):
  # check "gitleaks" on every PR with the base branch's rules, "gitleaks full history" (secret-scan-history.yml)
  # nightly and on push to main.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit (Lambda requirements, failing)
        run: |
          pip install pip-audit==2.10.1 --quiet
          pip-audit -r backend/requirements.txt

  # X1 (AA-852, plan S7 + review S241): the migrations/ checks, outside backend/ so a migration PR does
  # not redeploy the Lambdas. Three layers here (the fourth runs in AA-CIS-Infra), none may be skipped (a skip turns the job red):
  #   1. migrations/tests/migration_lint.py: TripPlanner rules (migration role per file number, OWNER TO
  #      only in tp-013, ALTER DEFAULT PRIVILEGES FOR ROLE tp_owner IN SCHEMA tripplanner, no role switch,
  #      no role membership GRANT, no set_config('role')), offline;
  #   2. test_tp013_pg.py: replay of tp-001…013 on PostgreSQL 15 + pgvector (the RDS Dev major) as a
  #      NOSUPERUSER stand-in of the master: owners, raw ACLs, default privileges, runtime DML, booking
  #      view-only read, a later file run as tp_owner; test_tp015_pg.py the same up to tp-015;
  #      test_replay_twice_pg.py (AA-849): every file applied twice, each as the role DB Migrate uses
  #      (live owner of schema tripplanner, XD8); the second pass must not error and must change nothing
  #      (catalog, row counts, registry rows), and the registered tp-NNN keys must equal the files;
  #   3. (AA-712 X4) the backend tests that run the catalog-view SQL on a real Postgres, same cluster;
  #   4. The DB Migrate runner lint (AA-CIS-Infra run_migration.py --inspect) runs in AA-CIS-Infra's
  #      required 'Migration lint and unique numbers' check on the byte copy, before any apply (S241:
  #      no cross-repo token or deploy key here; test_infra_runner.py stays for local runs).
  migrations:
    name: Migrations (lint, PG 15 replay)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read    # migration numbers: the files of the other open PRs (deploy-lambdas.yml grants it too)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AA-1024 l22 (S271 lessons guard G10): an added line naming a migration by its old number after a renumber
      # (the file keeps its name, so a search for the new number misses it), or a file the PR removes. Mark a history
      # note with old-mig-ok. Same script as the CIS / Booking / Partner migration preflight.
      - name: Migration references (renumber left-overs)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          python3 .github/scripts/migration_refs.py --migrations-dir migrations --base "$BASE_SHA"

      # AA-1024 follow-up: the number part of the CIS / Booking / Partner migration preflight. An added file takes main
      # max + 1 (then + 2, ...) of the main fetched NOW (a re-run after another PR merged re-checks it), no number twice,
      # and no other open PR adds the same tp-NNN under another name (against an older PR: red; a newer one: warning).
      - name: Migration numbers (main max + 1, one open PR per tp-NNN)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          ARGS=(--migrations-dir migrations --base "$(git rev-parse FETCH_HEAD)" --pr "$PR_NUMBER")
          if gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json number,files \
              > "$RUNNER_TEMP/open-prs.json" 2> "$RUNNER_TEMP/gh.err"; then
            ARGS+=(--open-prs "$RUNNER_TEMP/open-prs.json")
          else
            echo "::notice::open pull requests not readable: $(head -c 300 "$RUNNER_TEMP/gh.err")"
          fi
          python3 .github/scripts/migration_numbers.py "${ARGS[@]}"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Same pins as backend/requirements.txt.
        run: pip install asyncpg==0.30.0 pytest==8.3.3

      - name: PostgreSQL 15 + pgvector (PGDG)
        # A cluster of its own on port 5433, trust auth, used only by the replay test.
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-15 postgresql-15-pgvector
          sudo pg_dropcluster --stop 15 main 2>/dev/null || true
          sudo pg_createcluster 15 x1 --port 5433 --start -- --auth=trust
          psql "postgresql://postgres@127.0.0.1:5433/postgres" -Atc "SELECT version()"

      - name: Migration lint + replays (tp-013, tp-015, every file twice) on PostgreSQL 15
        # Nothing may be skipped (AA-849): --fail-on-skip makes pytest exit non-zero on any skipped,
        # xfailed, xpassed or deselected test (a whole module skipped at collection included); the grep
        # below is the backstop if the option were ever dropped, and each replay module must report PASSED
        # lines, so deleting or renaming one cannot pass silently.
        run: |
          set -o pipefail
          pytest migrations/tests -v --tb=short -rs -p no:cacheprovider \
            --ignore=migrations/tests/test_infra_runner.py --fail-on-skip \
            --pg-dsn postgresql://postgres@127.0.0.1:5433/postgres --pg-major 15 --pg-require-vector \
            | tee /tmp/migrations.txt
          if grep -qE "[0-9]+ (skipped|xfailed|xpassed|deselected)" /tmp/migrations.txt; then
            echo "::error::migration tests were skipped, xfailed, xpassed or deselected"; exit 1
          fi
          for module in test_migration_lint test_tp013_pg test_tp015_pg test_tp016_pg test_tp017_pg test_tp018_pg test_tp019_pg test_tp021_pg test_replay_twice_pg; do
            if ! grep -qE "^migrations/tests/${module}\.py::[^ ]+ PASSED" /tmp/migrations.txt; then
              echo "::error::${module}.py reported no PASSED test"; exit 1
            fi
          done

      # AA-712 X4: after the reader removal the catalog-view SQL is TripPlanner's only read path, and the
      # tests that run that SQL against a real Postgres (browse/search/suggestions on catalog.v_*, the
      # route-suggestion property, the pgvector top-k search; AA-908: the traveller-account SQL; AA-1038: the tenant
      # context against the tp-025 shadow policy, on the migration replay; slice 2: the /{slug} assertion path) need --pg-dsn,
      # so "Backend (pytest)" (offline) skips them. They run here on the same PostgreSQL 15 + pgvector cluster; nothing may be skipped and
      # each module must report PASSED lines.
      - name: Catalog-view SQL on PostgreSQL 15 + pgvector (backend integration tests)
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pip install -r requirements.txt
          pytest tests/test_places_source_pg.py tests/test_route_property_pg.py tests/test_vector_topk_pg.py \
            tests/test_account_pg.py tests/test_jobs_pg.py tests/test_tenant_rls_pg.py tests/test_aa1038_tenant_site_pg.py \
            tests/test_aa1038_leads_pg.py \
            -v --tb=short -rs -p no:cacheprovider \
            --pg-dsn postgresql://postgres@127.0.0.1:5433/postgres \
            | tee /tmp/backend-pg.txt
          if grep -qE "[0-9]+ (skipped|xfailed|xpassed|deselected)" /tmp/backend-pg.txt; then
            echo "::error::backend PG tests were skipped, xfailed, xpassed or deselected"; exit 1
          fi
          for module in test_places_source_pg test_route_property_pg test_vector_topk_pg test_account_pg test_jobs_pg test_tenant_rls_pg test_aa1038_tenant_site_pg test_aa1038_leads_pg; do
            if ! grep -qE "^tests/${module}\.py::[^ ]+ PASSED" /tmp/backend-pg.txt; then
              echo "::error::${module}.py reported no PASSED test"; exit 1
            fi
          done

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      # AA-994 S5a (root ADR 0016 decision 5) — the vendored UI kit core (tokens profile), before npm ci
      # (dependency-free). Integrity: every file of ui/core has the sha256 of its MANIFEST.json, no file is missing or
      # extra, the manifest is the one kit.lock.json pins, and no CSS file outside ui/core/tokens.css defines an --aa-*
      # variable (TripPlanner-only values are --tp-*). Provenance: that manifest is AA-CIS-App's at the lock's ref and
      # the ref is on CIS main (reads GitHub only when this change touches frontend/kit.lock.json or frontend/ui/core;
      # otherwise it passes at once). No merge queue here, so the pull_request run is the gate.
      - name: Kit core integrity (check-kit-copy.mjs)
        run: |
          node ui/core/check-kit-copy.mjs
          node ui/core/check-kit-copy.mjs --css .

      - name: Kit core provenance (kit.lock.json ref on AA-CIS-App main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 ../.github/scripts/check_kit_provenance.py kit.lock.json --base "$BASE_SHA"

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Save npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # AA-994 S5a (root ADR 0016 decision 7, plan guards G4, G6, G10, G11) — app/**, components/** and ui/** (minus the
      # kit core copy) are linted with the kit token rules (ui/core/eslint-kit.mjs, `tailwind` preset: no-hex-colour,
      # no-raw-aa-var, no-aa-var-definition) at `error`; the violations that existed before S5a (map paint colours, the
      # theme-color meta) are frozen in frontend/eslint-suppressions.json (ESLint bulk suppressions), which only shrinks:
      #   1. `eslint --prune-suppressions` fails on any violation the file does not cover and rewrites the file;
      #   2. the committed file must equal the pruned one (a fix that did not prune its entries fails);
      #   3. no entry and no rule total may grow against the base branch's file;
      #   4. no inline `eslint-disable` of a kit rule (or bare `eslint-disable`) in app code.
      # They run even when an earlier step failed (once npm ci succeeded), so one run shows every reason.
      - name: Lint (eslint, kit token rules at error, suppressions pruned)
        id: eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --prune-suppressions

      - name: Suppressions file is pruned
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        run: |
          if ! git diff --exit-code -- eslint-suppressions.json; then
            echo "::error file=frontend/eslint-suppressions.json::Violations were fixed but their suppressions were not removed. Run 'npx eslint --prune-suppressions' in frontend/ and commit eslint-suppressions.json (the diff above)."
            exit 1
          fi
          git checkout -- eslint-suppressions.json

      - name: Suppressions do not grow
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::No base commit for this event: suppressions growth check skipped."
              exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_FILE="$RUNNER_TEMP/base-eslint-suppressions.json"
          if ! git show "$BASE_SHA:frontend/eslint-suppressions.json" > "$BASE_FILE" 2>/dev/null; then
            echo "::notice::The base commit has no frontend/eslint-suppressions.json (this change creates the baseline): growth check skipped."
            exit 0
          fi
          BASE_LIST="$RUNNER_TEMP/base-frontend-files.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- . > "$BASE_LIST"  # paths relative to frontend/ (the cwd)
          node ui/core/check-kit-copy.mjs --suppressions "$BASE_FILE" eslint-suppressions.json --base-files "$BASE_LIST"

      - name: No inline disable of a kit rule
        if: ${{ !cancelled() }}
        run: |
          node ui/core/check-kit-copy.mjs --no-kit-disable app
          node ui/core/check-kit-copy.mjs --no-kit-disable components
          node ui/core/check-kit-copy.mjs --no-kit-disable ui --ignore core

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Build must pass without any secrets. NEXT_PUBLIC_MAPBOX_TOKEN is
        # intentionally unset here — the app builds and degrades gracefully.
        run: npm run build
