name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "task/**", "chore/**", "feature/**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # All backend unit tests are offline (no DB / Mapbox / Bedrock);
        # PYTHONPATH points at the repo root so `import backend.*` resolves.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v --tb=short


  # X1 (AA-852, plan S7 + review S241): the migrations/ checks, outside backend/ so a migration PR does
  # not redeploy the Lambdas. Two layers here (the third runs in AA-CIS-Infra), none may be skipped (a skip turns the job red):
  #   1. migrations/tests/migration_lint.py: TripPlanner rules (migration role per file number, OWNER TO
  #      only in tp-013, ALTER DEFAULT PRIVILEGES FOR ROLE tp_owner IN SCHEMA tripplanner, no role switch,
  #      no role membership GRANT, no set_config('role')), offline;
  #   2. test_tp013_pg.py: replay of tp-001…013 on PostgreSQL 15 + pgvector (the RDS Dev major) as a
  #      NOSUPERUSER stand-in of the master: owners, raw ACLs, default privileges, runtime DML, booking
  #      view-only read, a later file run as tp_owner;
  #   3. The DB Migrate runner lint (AA-CIS-Infra run_migration.py --inspect) runs in AA-CIS-Infra's
  #      required 'Migration lint and unique numbers' check on the byte copy, before any apply (S241:
  #      no cross-repo token or deploy key here; test_infra_runner.py stays for local runs).
  migrations:
    name: Migrations (lint, PG 15 replay)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Same pins as backend/requirements.txt.
        run: pip install asyncpg==0.30.0 pytest==8.3.3

      - name: PostgreSQL 15 + pgvector (PGDG)
        # A cluster of its own on port 5433, trust auth, used only by the replay test.
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-15 postgresql-15-pgvector
          sudo pg_dropcluster --stop 15 main 2>/dev/null || true
          sudo pg_createcluster 15 x1 --port 5433 --start -- --auth=trust
          psql "postgresql://postgres@127.0.0.1:5433/postgres" -Atc "SELECT version()"

      - name: Migration lint + tp-013 replay on PostgreSQL 15
        run: |
          set -o pipefail
          pytest migrations/tests -v --tb=short -rs -p no:cacheprovider \
            --ignore=migrations/tests/test_infra_runner.py \
            --pg-dsn postgresql://postgres@127.0.0.1:5433/postgres --pg-major 15 --pg-require-vector \
            | tee /tmp/migrations.txt
          if grep -qE "[0-9]+ skipped" /tmp/migrations.txt; then
            echo "::error::migration tests were skipped"; exit 1
          fi

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Build must pass without any secrets. NEXT_PUBLIC_MAPBOX_TOKEN is
        # intentionally unset here — the app builds and degrades gracefully.
        run: npm run build
