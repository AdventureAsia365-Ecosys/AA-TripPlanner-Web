name: Deploy Lambdas

# Builds the two TripPlanner Lambda zips and ships them to AWS via a
# least-privilege GitHub OIDC role (aa-tripplanner-dev-app-deploy, defined in
# AA-CIS-Infra accounts/aa365/tripplanner.tf). This repo owns the Lambda CODE;
# AA-CIS-Infra owns the infrastructure. See that repo's
# docs/implementation-notes/AA-TripPlanner-backend.md.
#
# Prereqs (one-time, done in AA-CIS-Infra apply):
#   - the two Lambdas + the artifacts bucket + the OIDC deploy role exist.
# Repo configuration (Settings -> Secrets and variables -> Actions):
#   - secret AWS_DEPLOY_ROLE_ARN: the OIDC deploy role (AA-CIS-Infra output of
#     aws_iam_role.tripplanner_app_deploy). Required. A SECRET, not a variable,
#     so the account ID inside it is masked in this public repo's run logs
#     (AA-902: no account ID in tracked files or public logs).
#   - variable LAMBDA_ARTIFACTS_BUCKET (optional): defaults to
#     aa-tripplanner-dev-lambda-artifacts-<account of the assumed role>, read
#     from STS after the OIDC login; the account ID is masked in the log.
#
# Post-deploy verify (AA-993 V4, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml (app lambdas, also
# dispatchable with expected_sha; rows .github/verify/lambdas.rows): both functions Active, LastUpdateStatus
# Successful and CodeSha256 = the zip this run uploaded (S3 metadata git-sha / app-version / code-sha256 written
# below), then the read-only browse + assembly rows through the production BFF (the former inline smoke, AA-879).
# The `result` job ("Deploy Lambdas result") is red when any job did not succeed, skipped included: read that one.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambdas.yml"

permissions:
  id-token: write # assume the OIDC role
  contents: read

concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  ARTIFACTS_BUCKET_STEM: aa-tripplanner-dev-lambda-artifacts
  BROWSE_FUNCTION: aa-tripplanner-dev-browse
  ASSEMBLY_FUNCTION: aa-tripplanner-dev-assembly

jobs:
  # AA-879: the deploy runs only after the full CI workflow passed on this commit (ci.yml is reusable via
  # workflow_call). Before, a push to main deployed the Lambdas in parallel with CI, so a red commit shipped.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build + deploy Lambda code
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Build Lambda zips
        run: bash backend/package_lambdas.sh

      - name: Check AWS_DEPLOY_ROLE_ARN
        env:
          HAS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          if [ "${HAS_ROLE}" != "true" ]; then
            echo "::error::Secret AWS_DEPLOY_ROLE_ARN is not set (AA-CIS-Infra output of the tripplanner deploy role); nothing deployed."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # The account ID is masked from here on (::add-mask:: and the action's own mask).
      - name: Verify identity + resolve the artifacts bucket
        env:
          BUCKET_OVERRIDE: ${{ vars.LAMBDA_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          aws sts get-caller-identity --query Arn --output text
          echo "ARTIFACTS_BUCKET=${BUCKET_OVERRIDE:-${ARTIFACTS_BUCKET_STEM}-${account}}" >> "$GITHUB_ENV"

      # AA-993: each zip carries what it was built from as object metadata: git-sha (this commit), app-version (the
      # manifest, as package_lambdas.sh baked it in) and code-sha256 (base64 SHA-256 of the zip, the same form as the
      # function's CodeSha256). The verify compares the running functions against these, also on a later dispatch.
      - name: Upload artifacts to S3
        run: |
          set -euo pipefail
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          for name in browse assembly; do
            zip="dist/tripplanner/${name}.zip"
            code=$(openssl dgst -sha256 -binary "$zip" | base64)
            meta=$(jq -cn --arg s "$GITHUB_SHA" --arg v "$APP_VERSION" --arg c "$code" \
                     '{"git-sha": $s, "app-version": $v, "code-sha256": $c}')
            aws s3 cp "$zip" "s3://${ARTIFACTS_BUCKET}/${name}.zip" --metadata "$meta" --only-show-errors
            echo "${name}.zip: CodeSha256 ${code}, ${GITHUB_SHA}, version ${APP_VERSION}"
          done

      - name: Update Lambda code from S3
        run: |
          aws lambda update-function-code \
            --function-name "${BROWSE_FUNCTION}" \
            --s3-bucket "${ARTIFACTS_BUCKET}" --s3-key browse.zip \
            --publish >/dev/null
          aws lambda update-function-code \
            --function-name "${ASSEMBLY_FUNCTION}" \
            --s3-bucket "${ARTIFACTS_BUCKET}" --s3-key assembly.zip \
            --publish >/dev/null

      - name: Wait for updates to settle
        run: |
          aws lambda wait function-updated --function-name "${BROWSE_FUNCTION}"
          aws lambda wait function-updated --function-name "${ASSEMBLY_FUNCTION}"
          echo "Both Lambdas updated."

  # AA-993 V4 (ADR 0016 D3) — the post-update checks (the AA-879 smoke rows plus each function's CodeSha256 and
  # LastUpdateStatus) moved to post-deploy-verify.yml, also dispatchable on its own. It runs only when `deploy`
  # succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      app: lambdas
      expected_sha: ${{ github.sha }}
      from_deploy: true
    secrets: inherit

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so a failed ci/deploy (verify then skips)
  # could otherwise look like "nothing to verify". Every job here must succeed on every event (none is conditional).
  result:
    name: Deploy Lambdas result
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs: [ci, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 3 ]; then
            echo "::error::Deploy Lambdas ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Lambdas ($EVENT): deployed and verified."
