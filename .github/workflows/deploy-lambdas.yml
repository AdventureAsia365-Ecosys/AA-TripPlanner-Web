name: Deploy Lambdas

# Builds the two TripPlanner Lambda zips and ships them to AWS via a
# least-privilege GitHub OIDC role (aa-tripplanner-dev-app-deploy, defined in
# AA-CIS-Infra accounts/aa365/tripplanner.tf). This repo owns the Lambda CODE;
# AA-CIS-Infra owns the infrastructure. See that repo's
# docs/implementation-notes/AA-TripPlanner-backend.md.
#
# Prereqs (one-time, done in AA-CIS-Infra apply):
#   - the two Lambdas + the artifacts bucket + the OIDC deploy role exist.
# Repo configuration (Settings -> Secrets and variables -> Actions):
#   - secret AWS_DEPLOY_ROLE_ARN: the OIDC deploy role (AA-CIS-Infra output of
#     aws_iam_role.tripplanner_app_deploy). Required. A SECRET, not a variable,
#     so the account ID inside it is masked in this public repo's run logs
#     (AA-902: no account ID in tracked files or public logs).
#   - variable LAMBDA_ARTIFACTS_BUCKET (optional): defaults to
#     aa-tripplanner-dev-lambda-artifacts-<account of the assumed role>, read
#     from STS after the OIDC login; the account ID is masked in the log.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambdas.yml"

permissions:
  id-token: write # assume the OIDC role
  contents: read

concurrency:
  group: deploy-lambdas
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  ARTIFACTS_BUCKET_STEM: aa-tripplanner-dev-lambda-artifacts
  BROWSE_FUNCTION: aa-tripplanner-dev-browse
  ASSEMBLY_FUNCTION: aa-tripplanner-dev-assembly

jobs:
  # AA-879: the deploy runs only after the full CI workflow passed on this commit (ci.yml is reusable via
  # workflow_call). Before, a push to main deployed the Lambdas in parallel with CI, so a red commit shipped.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build + deploy Lambda code
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Lambda zips
        run: bash backend/package_lambdas.sh

      - name: Check AWS_DEPLOY_ROLE_ARN
        env:
          HAS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          if [ "${HAS_ROLE}" != "true" ]; then
            echo "::error::Secret AWS_DEPLOY_ROLE_ARN is not set (AA-CIS-Infra output of the tripplanner deploy role); nothing deployed."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # The account ID is masked from here on (::add-mask:: and the action's own mask).
      - name: Verify identity + resolve the artifacts bucket
        env:
          BUCKET_OVERRIDE: ${{ vars.LAMBDA_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          aws sts get-caller-identity --query Arn --output text
          echo "ARTIFACTS_BUCKET=${BUCKET_OVERRIDE:-${ARTIFACTS_BUCKET_STEM}-${account}}" >> "$GITHUB_ENV"

      - name: Upload artifacts to S3
        run: |
          aws s3 cp dist/tripplanner/browse.zip   "s3://${ARTIFACTS_BUCKET}/browse.zip"
          aws s3 cp dist/tripplanner/assembly.zip "s3://${ARTIFACTS_BUCKET}/assembly.zip"

      - name: Update Lambda code from S3
        run: |
          aws lambda update-function-code \
            --function-name "${BROWSE_FUNCTION}" \
            --s3-bucket "${ARTIFACTS_BUCKET}" --s3-key browse.zip \
            --publish >/dev/null
          aws lambda update-function-code \
            --function-name "${ASSEMBLY_FUNCTION}" \
            --s3-bucket "${ARTIFACTS_BUCKET}" --s3-key assembly.zip \
            --publish >/dev/null

      - name: Wait for updates to settle
        run: |
          aws lambda wait function-updated --function-name "${BROWSE_FUNCTION}"
          aws lambda wait function-updated --function-name "${ASSEMBLY_FUNCTION}"
          echo "Both Lambdas updated."

      # AA-879: post-deploy smoke through the public front door (the production BFF on Vercel calls the API
      # Gateway with the edge key; the API host itself is not written in this public repo). Read-only:
      #   browse   — /api/browse?resource=countries (a cache-buster skips the Vercel CDN, which would otherwise
      #              answer from cache without touching the Lambda) → 200 + a non-empty country list;
      #   assembly — two trip reads of the all-zero UUID (no-store) with no guest session. The Lambda answers
      #              both with 404 {"error": "not found"}: the trip read GETs check the guest token and never
      #              leak existence (AA-909). What the browser sees differs per read:
      #              - coverage  (/api/trip?resource=coverage&trip_id=…): the BFF passes the Lambda's 404 through,
      #                so this check pins the Lambda's own contract;
      #              - itinerary (/api/trip?trip_id=…): since AA-837 the BFF turns that one 404 into a 200 empty
      #                trip {"itinerary": [], "custom_days": []} (lib/tripProxy.ts tripReadAnswer), so a first
      #                visit to /plan logs no console error. A Lambda 5xx still passes through and fails it.
      # 3 tries, 10 s apart (cold start of the new code).
      - name: Smoke test (browse + assembly through the production BFF)
        env:
          BASE: https://aa-tripplanner.vercel.app
          ZERO_TRIP: 00000000-0000-0000-0000-000000000000
        run: |
          set -uo pipefail
          check() {  # $1 name, $2 path, $3 jq assertion, $4 expected HTTP code (default 200)
            local code=000 want="${4:-200}"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/smoke.json -w '%{http_code}' --max-time 30 "${BASE}$2" || echo 000)
              if [ "$code" = "$want" ] && jq -e "$3" /tmp/smoke.json >/dev/null 2>&1; then
                echo "smoke [$1] $2 -> $want OK (attempt $attempt)"; return 0
              fi
              sleep 10
            done
            echo "::error::smoke [$1] $2 -> HTTP $code, body: $(head -c 300 /tmp/smoke.json 2>/dev/null)"
            return 1
          }
          fail=0
          check browse "/api/browse?resource=countries&_cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '(.countries | length) > 0' || fail=1
          check assembly-coverage "/api/trip?resource=coverage&trip_id=${ZERO_TRIP}" \
            '.error == "not found"' 404 || fail=1
          check assembly-itinerary "/api/trip?trip_id=${ZERO_TRIP}" \
            '.itinerary == [] and .custom_days == []' 200 || fail=1
          [ "$fail" = "0" ] && echo "All Lambda smoke checks passed" || exit 1
