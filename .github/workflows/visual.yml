name: Visual

# AA-994 S5b (root ADR 0016; plan docs/audits/2026-10-27-S252-aa994-design-system/plan.md section 4) — the public
# pages of TripPlanner (e2e/visual/pages.ts: every app route, guard G16 in frontend/lib/visualPages.test.ts) at
# 1440 x 900 and 390 x 844, light and dark, on a deployment:
#   - no page-level horizontal overflow, no console error / page error, no failed same-origin request;
#   - a full-page PNG per page x viewport x theme.
# Artifact `visual-tripplanner-<target>-<run id>`: the PNGs + report.json (14 days). The job summary has one table
# (page x 4 cells).
#
# Triggers:
#   workflow_call      from deploy-web-dev.yml after a verified deploy, on the public host
#                      https://tripplanner.lumiguides.it.com (ECS behind CloudFront). Report-only: the caller's verdict
#                      job does not wait on it, so a red visual run never blocks a deploy (plan 4.3).
#   workflow_dispatch  any base_url (default: the public host), optional page filter.
# TripPlanner has no signed-in capture (B2C, every page is public) and no protected preview any more (the Vercel
# previews and their bypass secret left with the Vercel project, AA-1038), so this workflow reads no secret. The
# planner pages pass the web ACL's silent Challenge in the real browser, like a traveller's.
on:
  workflow_call:
    inputs:
      base_url:
        description: "Deployment to capture (the public host)."
        required: true
        type: string
      target:
        description: "Artifact name part (production)."
        required: true
        type: string
      sha:
        description: "The deployed commit (checks out the same spec and page list)."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to capture"
        required: true
        type: string
        default: https://tripplanner.lumiguides.it.com
      pages:
        description: "Optional Playwright --grep on '<page slug> <theme>' (e.g. 'destination|tour')"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-${{ inputs.base_url }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual (public pages, 1440/390, light/dark)
    # Pinned like the CIS ui-smoke job: Playwright's Chromium is not supported on newer runner images yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e/visual
    env:
      BASE_URL: ${{ inputs.base_url }}
      TARGET: ${{ inputs.target || 'dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/visual/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      # The home answers 200 before anything is captured (a few tries: a deploy may still be settling).
      - name: Can the deployment be read?
        id: reach
        run: |
          CODE=000
          for _ in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          echo "GET $BASE_URL/ -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::error::$BASE_URL/ answered HTTP $CODE."
          exit 1

      - name: Install Playwright
        if: steps.reach.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Save npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true' && steps.reach.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Capture and check
        if: steps.reach.outputs.ok == 'true'
        env:
          GREP: ${{ inputs.pages }}
        run: |
          ARGS=(-c playwright.config.ts)
          [ -n "$GREP" ] && ARGS+=(--grep "$GREP")
          npx playwright test "${ARGS[@]}"

      - name: Summary
        if: always() && steps.reach.outputs.ok == 'true'
        run: |
          mkdir -p results
          {
            echo "### Visual — $TARGET ($BASE_URL)"
            echo ""
            node summary.mjs
          } | tee results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always() && steps.reach.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-tripplanner-${{ inputs.target || 'dispatch' }}-${{ github.run_id }}
          path: |
            e2e/visual/results/shots/*.png
            e2e/visual/results/report.json
          if-no-files-found: warn
          retention-days: 14
